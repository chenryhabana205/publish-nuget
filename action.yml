name: Publish NuGet to nexus
author: chenryhabana205
description: Build, Pack & Publish a NuGet package with dotnet core on project version change

inputs:
    PROJECT_FILE_PATH:
        description: Filepath of the project to be packaged, relative to root of repository
        required: true
    PACKAGE_NAME:
        description: NuGet package id, used for version detection & defaults to project name
        required: false
    VERSION_FILE_PATH:
        description: Filepath with version info, relative to root of repository & defaults to PROJECT_FILE_PATH
        required: false
    VERSION_REGEX:
        description: Regex pattern to extract version info in a capturing group
        required: false
        default: ^\s*<Version>(.*)<\/Version>\s*$
    VERSION_STATIC:
        description: Useful with external providers like Nerdbank.GitVersioning, ignores VERSION_FILE_PATH & VERSION_REGEX
        required: false
    TAG_COMMIT:
        description: UNUSED since the Nexus rewrite - this action does not create git tags. Kept so existing workflows that pass it do not warn.
        required: false
        default: true
    TAG_FORMAT:
        description: UNUSED since the Nexus rewrite - see TAG_COMMIT.
        required: false
        default: v*
    NUGET_KEY:
        description: API key to authenticate with NuGet server
        required: false
    NUGET_SOURCE:
        description: Nexus BASE uri, NOT the repository path - /repository/<NEXUS_REPOSITORY>/ is appended when pushing, and the base is needed to reach the REST search API
        required: false
        default: https://api.nuget.org
    NEXUS_REPOSITORY:
        description: Nexus repository name to search and push to
        required: false
        default: nuget-hosted
    INCLUDE_SYMBOLS:
        description: Flag to toggle pushing symbols along with nuget package to the server, disabled by default
        required: false
        default: false
    NEXUS_USERNAME:
        description: Username for the Nexus REST search API, which rejects anonymous queries
        required: true
    NEXUS_PASSWORD:
        description: Password for the Nexus REST search API, which rejects anonymous queries
        required: true

outputs:
    VERSION:
        description: Version of the associated git tag

    PACKAGE_NAME:
        description: Name of the NuGet package generated
    
    PACKAGE_PATH:
        description: Path to the generated NuGet package

    SYMBOLS_PACKAGE_NAME:
        description: Name of the symbols package generated
    
    SYMBOLS_PACKAGE_PATH:
        description: Path to the generated symbols package

runs:
    using: node24
    main: index.js

branding:
    icon: package
    color: blue
